[package]
name = "my-chain-prover-nitro"
version = "1.0.0-rc.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "my-chain-prover-nitro"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
dotenvy.workspace = true
hex.workspace = true
serde_json.workspace = true
tokio.workspace = true
my-chain-prover.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
world-chain-proof-nitro-enclave = { workspace = true, features = ["enclave"] }
my-chain-proof-nitro-register.workspace = true
tracing-subscriber.workspace = true

# Proofs release train: cargo-release bumps every shared-version member in lockstep.
[package.metadata.release]
shared-version = "proofs"

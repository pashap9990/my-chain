[package]
name = "my-chain-proof-nitro-worker"
version = "1.0.0-rc.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "AWS Nitro TEE proving worker: leases jobs from the prover-service, proves them inside a Nitro Enclave, and submits the signed attestations back."

[lib]
path = "src/lib.rs"

[[bin]]
name = "my-chain-proof-nitro-worker"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
# Generic worker infrastructure
my-chain-proof-worker.workspace = true
my-chain-proof-metrics.workspace = true
my-chain-proof-protocol.workspace = true
my-chain-prover-service.workspace = true

# Nitro prover (host-side, requires Linux + enclave feature)
world-chain-proof-nitro-enclave = { workspace = true, features = ["enclave"] }
my-chain-proof-nitro-register.workspace = true

# Witness generation (shared with sp1-worker)
my-chain-proof-kona-host.workspace = true

# Chain config
my-chain-chainspec.workspace = true

# Alloy types
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-provider = { workspace = true, features = ["reqwest", "reqwest-rustls-tls"] }
alloy-sol-types.workspace = true

# Async / runtime
tokio = { workspace = true, features = ["full", "signal"] }
backon.workspace = true

# Error handling / logging
anyhow.workspace = true
async-trait.workspace = true
tracing.workspace = true
telemetry-batteries.workspace = true

# Config
clap.workspace = true
dotenvy.workspace = true

# Misc
hex.workspace = true

# Proofs release train: cargo-release bumps every shared-version member in lockstep.
[package.metadata.release]
shared-version = "proofs"
